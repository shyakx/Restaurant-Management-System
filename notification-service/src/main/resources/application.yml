spring:
  application:
    name: notification-service
  profiles:
    active: local-dev
  
  # Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.restaurant.notification.dto.OrderEvent
  
  # Email Configuration (for testing with Mailtrap)
  mail:
    host: sandbox.smtp.mailtrap.io
    port: 2525
    username: ${EMAIL_USERNAME:s.shyaka1@alustudent.com}
    password: ${EMAIL_PASSWORD:0782194138@Steve}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Eureka Service Discovery
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false

# Logging
logging:
  level:
    org.springframework.kafka: DEBUG
    com.restaurant.notification: DEBUG

server:
  port: 8084
