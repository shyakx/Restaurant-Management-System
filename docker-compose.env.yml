services:
  # Main database for all restaurant services
  postgres:
    image: postgres:15-alpine
    container_name: restaurant-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - restaurant-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: restaurant-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - restaurant-network

  # Zookeeper (Required for Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: restaurant-zookeeper
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - restaurant-network

  # Kafka Message Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: restaurant-kafka
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - restaurant-network

  # Kafka UI for monitoring (simple, no auth)
  kafka-ui:
    image: obsidiandynamics/kafdrop:latest
    container_name: restaurant-kafka-ui
    ports:
      - "${KAFKA_UI_PORT:-8090}:9000"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKERCONNECT: kafka:9092
      KAFKA_PROPERTIES_SECURITY_PROTOCOL: PLAINTEXT
      SERVER_SERVLET_CONTEXTPATH: /
    networks:
      - restaurant-network

  # Eureka Service Discovery
  eureka-server:
    build: ./eureka-server
    container_name: restaurant-eureka
    ports:
      - "${EUREKA_SERVER_PORT:-8761}:8761"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local-dev}
      EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS: 10
      EUREKA_CLIENT_INITIAL_REGISTRY_RETRIEVAL_INTERVAL_SECONDS: 15
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - restaurant-network

  # API Gateway
  api-gateway:
    build: ./api-gateway
    container_name: restaurant-api-gateway
    ports:
      - "${API_GATEWAY_PORT:-8081}:8081"
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local-dev}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: ${EUREKA_SERVER_URL}
      EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS: 10
      EUREKA_CLIENT_INITIAL_REGISTRY_RETRIEVAL_INTERVAL_SECONDS: 15
      SPRING_CLOUD_GATEWAY_HTTPCLIENT_CONNECT_TIMEOUT: 5000
      SPRING_CLOUD_GATEWAY_HTTPCLIENT_RESPONSE_TIMEOUT: 30s
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 90s
    networks:
      - restaurant-network

  # Order Service
  order-service:
    build: ./order-service
    container_name: restaurant-order-service
    ports:
      - "${ORDER_SERVICE_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: ${EUREKA_SERVER_URL}
      EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS: 10
      EUREKA_CLIENT_INITIAL_REGISTRY_RETRIEVAL_INTERVAL_SECONDS: 15
      SPRING_JPA_PROPERTIES_HIBERNATE_HBM2DDL_AUTO: update
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 90s
    networks:
      - restaurant-network

  # Kitchen Service
  kitchen-service:
    build: ./kitchen-service
    container_name: restaurant-kitchen-service
    ports:
      - "${KITCHEN_SERVICE_PORT:-8083}:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: ${EUREKA_SERVER_URL}
      EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS: 10
      EUREKA_CLIENT_INITIAL_REGISTRY_RETRIEVAL_INTERVAL_SECONDS: 15
      SPRING_JPA_PROPERTIES_HIBERNATE_HBM2DDL_AUTO: update
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 90s
    networks:
      - restaurant-network

  # Notification Service
  notification-service:
    build: ./notification-service
    container_name: restaurant-notification-service
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8084}:8084"
    depends_on:
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local-dev}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: ${EUREKA_SERVER_URL}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      IN_DOCKER: "true"
      EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS: 10
      EUREKA_CLIENT_INITIAL_REGISTRY_RETRIEVAL_INTERVAL_SECONDS: 15
    healthcheck:
      test: ["CMD", "curl", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 90s
    networks:
      - restaurant-network

volumes:
  postgres_data:

networks:
  restaurant-network:
    driver: bridge
